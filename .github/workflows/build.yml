# LumaOS CI — Build validation + QEMU boot test
#
# Toolchain: LLVM/Clang + LLD (no NASM — all assembly is clang-integrated)
# QEMU: UEFI boot via OVMF (files tracked in tools/ovmf/)
#
# Jobs:
#   build     — make clean && make, verify artifacts
#   qemu-test — boot in QEMU headless, inject shell commands, check serial markers

name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (Clang + LLD)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Clang + LLD)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Build kernel + bootloader + disk image
        run: make clean && make

      - name: Verify build artifacts
        run: |
          echo "Checking artifacts:"
          test -f build/kernel/kernel.elf && echo "  ✓ kernel.elf" || { echo "  ✗ kernel.elf missing"; exit 1; }
          test -f build/boot/BOOTX64.EFI && echo "  ✓ BOOTX64.EFI" || { echo "  ✗ BOOTX64.EFI missing"; exit 1; }
          test -f build/disk.img && echo "  ✓ disk.img" || { echo "  ✗ disk.img missing"; exit 1; }
          echo "All artifacts present."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumaos-build
          path: |
            build/kernel/kernel.elf
            build/boot/BOOTX64.EFI
            build/disk.img
          retention-days: 7

  qemu-test:
    name: QEMU Boot Test
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld qemu-system-x86

      - name: Build
        run: make clean && make

      - name: Diagnostic info
        run: |
          echo "=== QEMU version ==="
          qemu-system-x86_64 --version
          echo ""
          echo "=== OVMF firmware ==="
          ls -lh tools/ovmf/
          echo ""
          echo "=== Build artifacts ==="
          ls -lh build/efi_root/EFI/BOOT/
          ls -lh build/kernel/kernel.elf
          ls -lh build/disk.img
          echo ""
          echo "=== Disk image (first 64 bytes) ==="
          xxd -l 64 build/disk.img

      - name: Boot in QEMU (headless, inject shell input)
        run: |
          set -x

          # Copy OVMF vars (normally done by 'make run')
          cp tools/ovmf/OVMF_VARS.fd build/ovmf_vars.fd

          # Start QEMU headless:
          #   -display none  : no GTK in headless CI
          #   -no-reboot     : exit on triple fault instead of reboot loop
          #   -monitor unix  : QEMU monitor on unix socket for sendkey injection
          #   -serial file   : serial output to file (no buffering issues with tee)
          qemu-system-x86_64 \
            -display none \
            -no-reboot \
            -monitor unix:/tmp/qemu-mon.sock,server,nowait \
            -drive if=pflash,format=raw,unit=0,file=tools/ovmf/OVMF_CODE.fd,readonly=on \
            -drive if=pflash,format=raw,unit=1,file=build/ovmf_vars.fd \
            -drive file=fat:rw:build/efi_root,format=raw,media=disk \
            -drive file=build/disk.img,format=raw,if=ide,index=1 \
            -serial file:serial.log &
          QEMU_PID=$!

          # Wait for kernel to boot, init to run tests, and shell to start
          sleep 10

          # Inject shell commands via QEMU monitor sendkey
          # sendkey injects PS/2 scan codes into the virtual keyboard controller
          #
          # AZERTY key mapping notes:
          #   - 'a' on AZERTY is at QWERTY 'q' position (scancode 0x10)
          #   - '.' on AZERTY is Shift + QWERTY ';' key (scancode 0x33)
          #   - Letters c,e,h,l,o,t,x are at the same position on both layouts
          python3 << 'PYEOF'
          import socket, time

          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.connect('/tmp/qemu-mon.sock')

          # Drain QEMU monitor banner/welcome
          s.settimeout(0.5)
          try:
              while True:
                  data = s.recv(4096)
                  if not data:
                      break
          except socket.timeout:
              pass

          s.settimeout(2.0)

          def send_key(key):
              s.send(f'sendkey {key}\n'.encode())
              time.sleep(0.3)
              try:
                  s.recv(4096)
              except socket.timeout:
                  pass

          # Type "cat hello.txt" + Enter
          # c=0x2E, a->'q'(0x10), t=0x14, spc=0x39,
          # h=0x23, e=0x12, l=0x26, l=0x26, o=0x18,
          # .=dot(0x34), t=0x14, x=0x2D, t=0x14
          cat_keys = [
              'c', 'q', 't', 'spc',
              'h', 'e', 'l', 'l', 'o',
              'dot',
              't', 'x', 't', 'ret'
          ]
          for key in cat_keys:
              send_key(key)
          print("Sent 'cat hello.txt' + Enter via QEMU monitor")

          # Wait for cat to finish printing the file content
          time.sleep(3)

          # Type "run prog.elf" + Enter
          # Loads and executes the ELF64 program from FAT32 via syscall 12
          # r=0x13, u=0x16, n=0x31, spc=0x39,
          # p=0x19, r=0x13, o=0x18, g=0x22,
          # .=dot(0x34), e=0x12, l=0x26, f=0x21
          run_keys = [
              'r', 'u', 'n', 'spc',
              'p', 'r', 'o', 'g',
              'dot',
              'e', 'l', 'f', 'ret'
          ]
          for key in run_keys:
              send_key(key)
          print("Sent 'run prog.elf' + Enter via QEMU monitor")

          # Wait for program to load and run
          time.sleep(3)

          # Type "exit" + Enter
          exit_keys = ['e', 'x', 'i', 't', 'ret']
          for key in exit_keys:
              send_key(key)
          print("Sent 'exit' + Enter via QEMU monitor")

          s.close()
          PYEOF

          # Wait for shell to process "exit", trigger cleanup + regression test output
          sleep 5

          # Kill QEMU gracefully
          kill $QEMU_PID 2>/dev/null || true
          wait $QEMU_PID 2>/dev/null || true
          set +x

          echo ""
          echo "=== Full serial output ==="
          cat serial.log

      - name: Verify serial output markers
        run: |
          echo "=== Serial output (last 100 lines) ==="
          tail -100 serial.log
          echo ""
          echo "=== Checking boot markers ==="

          fail=0
          for marker in \
            "LumaOS" \
            "Kernel is alive!" \
            "[ATA]" \
            "[FAT32]" \
            "Phase 4+5 regression test passed" \
            "[VFS] test passed" \
            "[SYSCALL6] test passed" \
            "[CAT6] test passed" \
            "[INIT5] test passed" \
            "[EXEC12] test passed" \
            "[PCI7] devices:"
            "[ACPI7a2] tables parsed"
          do
            if grep -qF "$marker" serial.log; then
              echo "  ✓ Found: $marker"
            else
              echo "  ✗ Missing: $marker"
              fail=1
            fi
          done

          if [ "$fail" -eq 1 ]; then
            echo ""
            echo "::error::Boot test failed — one or more serial markers not found"
            exit 1
          fi

          echo ""
          echo "All boot markers found — LumaOS boots correctly in QEMU."

      - name: Upload serial log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: serial-output
          path: serial.log
          retention-days: 7
